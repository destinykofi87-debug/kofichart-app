<!DOCTYPE html>

<title>KofiChart - AI Trading Intelligence</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0e1a;color:#e2e8f0;font-family:sans-serif}
.header{background:#0f172a;padding:16px;border-bottom:1px solid #1e293b;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800;font-size:22px;color:#38bdf8}
.badge{background:#0ea5e9;color:white;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700}
.chart-wrap{height:55vh;background:#000}
.signal-bar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:12px;background:#0f172a}
.card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:12px;text-align:center}
.card h4{font-size:11px;color:#94a3b8;margin-bottom:6px}
.card .val{font-size:18px;font-weight:800}
.buy{color:#22c55e}.sell{color:#ef4444}.hold{color:#eab308}
.ai-panel{margin:12px;background:#1e293b;border:1px solid #334155;border-radius:16px;padding:16px}
.ai-title{font-weight:700;margin-bottom:12px}
.ai-text{font-size:14px;line-height:1.6;color:#cbd5e1;background:#0a0e1a;padding:12px;border-radius:10px;border-left:3px solid #38bdf8}
.controls{display:flex;gap:8px;margin:12px}
.btn{flex:1;padding:12px;border-radius:10px;border:none;font-weight:700;cursor:pointer}
.btn-primary{background:#0ea5e9;color:white}
.btn-dark{background:#1e293b;color:#e2e8f0;border:1px solid #334155}
</style>
</head>
